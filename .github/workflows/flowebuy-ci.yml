name: FLOWEBUY CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  validate-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript and frontend copies
        run: |
          node --check js/app.js
          node --check public/js/app.js
          node --check server/server.js
          node --check server/Database.js
          cmp index.html public/index.html
          cmp css/style.css public/css/style.css
          cmp js/app.js public/js/app.js

      - name: Start server and verify API
        shell: bash
        run: |
          set -euo pipefail
          cd server
          PORT=3131 FLOWEBUY_DB_PATH=/tmp/flowebuy-ci.db node server.js > /tmp/flowebuy-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3131/api/health > /tmp/flowebuy-health.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/flowebuy-server.log
              exit 1
            fi
            sleep 1
          done

          if ! test -s /tmp/flowebuy-health.json; then
            cat /tmp/flowebuy-server.log
            echo "Servidor não ficou pronto a tempo."
            exit 1
          fi

          curl --silent --show-error --fail http://127.0.0.1:3131/api/lojas > /tmp/flowebuy-stores.json
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('/tmp/flowebuy-stores.json','utf8')); if(!Array.isArray(rows)||rows.length<1) process.exit(1); console.log('API OK: '+rows.length+' lojas encontradas')"

          curl --silent --show-error --fail -X POST http://127.0.0.1:3131/api/lojas \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Loja de teste CI","descricao":"Criada no teste automatizado","icone":"🧪"}' \
            > /tmp/flowebuy-new-store.json
          STORE_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/flowebuy-new-store.json','utf8')).id")
          test -n "$STORE_ID"

          curl --silent --show-error --fail -X POST "http://127.0.0.1:3131/api/lojas/$STORE_ID/produtos" \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Produto de teste","preco":12.5,"img":"https://example.com/product.png"}' \
            > /tmp/flowebuy-new-product.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/flowebuy-new-product.json','utf8')); if(p.loja_id!==Number(process.env.STORE_ID)||p.nome!=='Produto de teste'||p.preco!==12.5) process.exit(1); console.log('CRUD de produto: OK')" 
          INVALID_STATUS=$(curl --silent --output /tmp/flowebuy-invalid.json --write-out '%{http_code}' -X POST "http://127.0.0.1:3131/api/lojas/$STORE_ID/produtos" -H 'Content-Type: application/json' -d '{"nome":"","preco":-1}')
          test "$INVALID_STATUS" = "400"

          curl --silent --show-error --fail http://127.0.0.1:3131/ | grep -q 'FLOWEBUY'
          echo 'Smoke tests concluídos.'
